name: SimpleList Release Publisher

on:
  push:
    branches: [ main ]
    paths:
      - 'SimpleList/**'
      - 'SimpleList.Core/**'
      - 'SimpleList.Tests/**'
      - 'SimpleList.sln'
      - '.github/workflows/dotnet-desktop.yml'

permissions:
  contents: write

env:
  # Configuring Project
  PROJECT_PATH: SimpleList/SimpleList.csproj
  APP_NAME: SimpleList

  # Check Tag
  CHECK_TAG_EXISTENCE_BEFORE_CREATING_TAG: true
  
  # Custom Nuget Source
  IS_COMMUNITY_TOOLKIT_NUGET_SOURCE_ENABLED: true
  IS_CUSTOM_NUGET_SOURCE_ENABLED: false
  CUSTOM_NUGET_SOURCES: ''

  # Configuring Dotnet Build Commands
  PUBLISH_OUTPUT_FOLDER: Publish
  PUBLISH_AOT: false # currently only Console App Supported

  # Configuring GitHub Release
  IS_PRE_RELEASE: false
  SKIP_IF_RELEASE_EXIST: true
  MAKE_LATEST: true
  ALLOW_UPDATES: false
  ARTIFACT_ERRORS_FAIL_BUILD: false

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Add CommunityToolkit package sources
      shell: pwsh
      run: |
        dotnet nuget add source https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json --name CommunityToolkit-Labs
        dotnet nuget add source https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-MainLatest/nuget/v3/index.json --name CommunityToolkit-Main

    - name: Restore
      run: dotnet restore SimpleList.sln -p:Platform=x64

    - name: Test
      run: dotnet test SimpleList.Tests/SimpleList.Tests.csproj -c Release -p:Platform=x64 --no-restore

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      app-version: ${{ steps.get-version.outputs.assembly-version }}
      IS_PRE_RELEASE: ${{ env.IS_PRE_RELEASE }}
    strategy:
      matrix:
        platform: [x64, x86, arm64]
        publish_flavor: [Portable, Slim]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Add CommunityToolkit Labs and Main nuget sources
    - run: |
        nuget sources add -name CommunityToolkit-Labs -source https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json
        nuget sources add -name CommunityToolkit-Main -source https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-MainLatest/nuget/v3/index.json
      if: contains(env.IS_COMMUNITY_TOOLKIT_NUGET_SOURCE_ENABLED, 'true')

    # Add Custom nuget sources
    - run: |
        $sources = $env:CUSTOM_NUGET_SOURCES -split ','
        $trimmedSources = $sources | ForEach-Object { $_.Trim() }
        $prefix = "CUSTOM_SOURCES_"
        for ($i = 0; $i -lt $trimmedSources.Length; $i++) {
          $sourceName = "${prefix}$($i + 1)"
          nuget sources add -name $sourceName -source $trimmedSources[$i]
        }
      if: contains(env.IS_CUSTOM_NUGET_SOURCE_ENABLED, 'true')

    # Reading version tag from the csproj file.
    - uses: kzrnm/get-net-sdk-project-versions-action@v2
      id: get-version
      with:
        proj-path: ${{ env.PROJECT_PATH }}

    # Building with configured commands
    - run: |
        $runtimeIdentifier = "${{ matrix.platform }}"
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-$($runtimeIdentifier.ToLower()) /p:GITHUB_ACTIONS=true -p:Platform=${{ matrix.platform }} -p:PublishFlavor=${{ matrix.publish_flavor }} -p:PublishAot=${{ env.PUBLISH_AOT }} --output ${{ env.PUBLISH_OUTPUT_FOLDER }}/${{ matrix.platform }}/${{ matrix.publish_flavor }}

    # Zipping folder and all files
    - uses: vimtor/action-zip@v1.2
      with:
        files: ${{ env.PUBLISH_OUTPUT_FOLDER }}/${{ matrix.platform }}/${{ matrix.publish_flavor }}
        recursive: true
        dest: ${{ env.APP_NAME }}-v${{ steps.get-version.outputs.assembly-version }}-${{ matrix.platform }}-${{ matrix.publish_flavor }}.zip

    # Uploading all zip files to access them in the 'release' job
    - uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.platform }}-${{ matrix.publish_flavor }}
        path: ${{ env.APP_NAME }}-v${{ steps.get-version.outputs.assembly-version }}-${{ matrix.platform }}-${{ matrix.publish_flavor }}.zip

    # Checking version suffix for words like [alpha, beta, preview, and experiment]. Marking the release as a pre-release if any exists.
    - run: |
        # Define the list of strings
        $list = @("beta", "alpha", "preview", "experiment")

        # Define the suffix variable
        $suffix = "${{ steps.get-version.outputs.version-suffix }}"

        foreach ($item in $list) {
          # Convert both strings to lower case for case-insensitive comparison
          if ($suffix.ToLower().StartsWith($item.ToLower())) {
            echo "IS_PRE_RELEASE=true" >> $env:GITHUB_ENV
            break
          }
        }


  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Read some variables from the 'build' job
      APP_VERSION: ${{ needs.build.outputs.app-version }}
      IS_PRE_RELEASE: ${{ needs.build.outputs.IS_PRE_RELEASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Downloading all zip files into the GitHub root directory (uploaded in 'build' job)
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Configuring git to create a tag
      - run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          TAG_NAME="v${{ env.APP_VERSION }}"
          if [[ "${{ env.CHECK_TAG_EXISTENCE_BEFORE_CREATING_TAG }}" == "true" ]]; then
              git fetch --tags
              if [[ $(git tag -l "$TAG_NAME") ]]; then
                  echo "Tag found (already exist). Skipping to the next step"
              else
                  echo "Tag not found, creating new tag"
                  git tag "$TAG_NAME"
                  git push origin "$TAG_NAME"
              fi
          else
              echo "Creating new tag"
              git tag "$TAG_NAME"
              git push origin "$TAG_NAME"
          fi  
          
      # Installing a package for generating a changelog file
      - run: npm install -g auto-changelog  
      - run: auto-changelog --tag-pattern .+ --commit-limit false --starting-version v${{ env.APP_VERSION }} --ending-version v${{ env.APP_VERSION }} --hide-credit  

      # Compose bilingual release notes with flavor explanation + changelog
      - run: |
          cat > RELEASE_BODY.md <<'EOF'
          ## Package Flavors / 安装包版本说明

          ### English

          - **Portable (recommended for most users)**: Self-contained package that includes the required .NET and Windows App SDK runtime components. No runtime installation is normally required, but the download is larger.
          - **Slim**: Smaller, framework-dependent package. The target machine must already have the matching architecture of **.NET 10 Desktop Runtime** and **Windows App Runtime 2.4** installed. SimpleList does **not** automatically install missing runtimes. If the app does not start, install both runtimes manually or use the Portable package.
          - End users only need the runtimes above; the developer-facing Windows App SDK is not required.

          ### 中文

          - **Portable（便携版，推荐大多数用户）**：自包含版本，已包含所需的 .NET 和 Windows App SDK 运行时组件，通常无需另外安装运行时，但下载体积较大。
          - **Slim（轻量版）**：依赖运行时的精简版本，体积较小。目标机器必须预先安装与系统架构匹配的 **.NET 10 Desktop Runtime** 和 **Windows App Runtime 2.4**。SimpleList 当前**不会自动安装**缺失的运行时；如果程序无法启动，请手动安装这两个运行时，或改用 Portable 版本。
          - 普通用户只需安装上述运行时，不需要安装开发用途的 Windows App SDK。

          Runtime downloads / 运行时下载：[.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) · [Windows App Runtime](https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads)

          ### Architecture / 架构选择

          - `x64`: Most Intel/AMD Windows PCs / 大多数 Intel、AMD Windows 电脑
          - `arm64`: Windows on ARM devices / Windows ARM 设备
          - `x86`: 32-bit Windows only / 仅限 32 位 Windows

          ### Artifact Naming / 产物命名

          - `SimpleList-vVERSION-PLATFORM-Portable.zip`
          - `SimpleList-vVERSION-PLATFORM-Slim.zip`

          ---

          EOF
          cat CHANGELOG.md >> RELEASE_BODY.md
      
      # Creating a Release in GitHub
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-*.zip"
          bodyFile: "RELEASE_BODY.md"
          name: v${{ env.APP_VERSION }}
          tag: v${{ env.APP_VERSION }}
          prerelease: ${{ env.IS_PRE_RELEASE }}
          skipIfReleaseExists: ${{ env.SKIP_IF_RELEASE_EXIST }}
          makeLatest: ${{ env.MAKE_LATEST }}
          allowUpdates: ${{ env.ALLOW_UPDATES }}
          artifactErrorsFailBuild: ${{ env.ARTIFACT_ERRORS_FAIL_BUILD }}



      # - uses: softprops/action-gh-release@v1
      #   with:
      #     name: v${{ env.APP_VERSION }}
      #     tag_name: v${{ env.APP_VERSION }}
      #     body_path: CHANGELOG.md
      #     prerelease: ${{ env.PUBLISH_PRE_RELEASE }}
      #     files: |
      #       ${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-*.zip
